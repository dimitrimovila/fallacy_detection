scheme_id: cause_to_effect
name: Argument from cause to effect
version: "2.0"

schema: |
  Generally, if A occurs, then B will (might) occur.
  In this case, A occurs (might occur).
  Therefore in this case, B will (might) occur.

identification_question: >-
  Does this text use a known causal relationship as a basis for predicting or
  explaining a future or past event?

variables:
  A: the putative cause
  B: the putative effect

default_answer_space: ["yes", "no"]

critical_questions:
  - id: CQ1
    text: >-
      Does the argument claim that A causes B solely because B occurred after A?
  - id: CQ2
    text: >-
      Does the text present a biased selection of evidence or cases that makes the
      causal generalization appear more strongly supported than it actually is?
  - id: CQ3
    text: >-
      Does the text report observed cases for the causal generalization that are too few
      to support it?
  - id: CQ4
    text: >-
      Does the text present A as the only cause of B, while B clearly also depends on
      other important causes?
  - id: CQ5
    text: Is it plausible that A leads to B, whatever one thinks of A or B?
  - id: CQ5.1
    text: Is it true that A occurs, or can occur, in the case at hand?

graph:
  start: CQ1
  nodes:
    CQ1:
      "yes": {terminal: post_hoc}
      "no":  {node: CQ2}
    CQ2:
      "yes": {terminal: cherry_picking}
      "no":  {node: CQ3}
    CQ3:
      "yes": {terminal: hasty_generalization}
      "no":  {node: CQ4}
    CQ4:
      "yes": {terminal: causal_reductionism}
      "no":  {node: CQ5}
    CQ5:
      "yes": {node: CQ5.1}
      "no":  {terminal: false_premise}
    CQ5.1:
      "yes": {terminal: good_argumentation}
      "no":  {terminal: false_premise, reconvergence: true}
