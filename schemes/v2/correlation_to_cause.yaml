scheme_id: correlation_to_cause
name: Argument from correlation to cause
version: "2.0"

schema: |
  There is a positive or negative correlation between A and B.
  Therefore, A causes B.

identification_question: >-
  Does this text start with two correlated events and conclude that one causes
  the other?

variables:
  A: the putative cause
  B: the second correlated event (the putative effect)

default_answer_space: ["yes", "no"]

critical_questions:
  - id: CQ1
    text: Is there actually a positive or negative correlation between A and B?
  - id: CQ2
    text: >-
      Does the text report observed cases for the correlation that are too few to
      support it?
  - id: CQ3
    text: >-
      Does the claim that one of the two events causes the other rest only on the fact
      that it occurs before the other?
  - id: CQ4
    text: >-
      Does the causal relationship actually go from B to A, and not just from A to B?
  - id: CQ5
    text: Is there a third, well-known factor that causes both A and B?
  - id: CQ6
    text: >-
      Does the text present A as the only cause of B, while B clearly also depends on
      other causes?

graph:
  start: CQ1
  nodes:
    CQ1:
      "yes": {node: CQ2}
      "no":  {terminal: false_premise}
    CQ2:
      "yes": {terminal: hasty_generalization}
      "no":  {node: CQ3}
    CQ3:
      "yes": {terminal: post_hoc}
      "no":  {node: CQ4}
    CQ4:
      "yes": {terminal: questionable_cause}
      "no":  {node: CQ5}
    CQ5:
      "yes": {terminal: questionable_cause, reconvergence: true}
      "no":  {node: CQ6}
    CQ6:
      "yes": {terminal: causal_reductionism}
      "no":  {terminal: good_argumentation}
