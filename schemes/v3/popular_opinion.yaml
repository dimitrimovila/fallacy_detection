scheme_id: popular_opinion
name: Argument from popular opinion
version: "2.1"

schema: |
  If a large majority of some reference group accept A as true, then there is a
  presumption in favour of A.
  A large majority of the reference group accept A as true.
  Therefore there is a presumption in favour of A.

identification_question: >-
  Does this text use the fact that the conclusion is supported by a relatively
  large number of people as its main argument in favour of that conclusion?

variables:
  A: the proposition held to be true by the group

default_answer_space: ["yes", "no"]

critical_questions:
  - id: CQ1
    text: >-
      Does the argument rely on the views of particular people that the text identifies,
      rather than only on the claim that people in general accept A?
  - id: CQ2
    text: >-
      Were the people whose views are cited drawn from a group that is more likely to hold
      those views than the population the conclusion is about?
  - id: CQ3
    text: >-
      Are the people whose views are cited too few to support the conclusion drawn from
      them?
  - id: CQ4
    text: >-
      Is the wide acceptance of A offered as a presumption that remains open to other
      evidence, rather than as proof that A is true?
  - id: CQ5
    text: >-
      Does the argument use the fact that people have long preferred a practice or belief as
      a reason that this preference is correct?
  - id: CQ6
    text: >-
      Does the argument claim something is better or truer solely because it is natural?

graph:
  start: CQ1
  nodes:
    CQ1:
      "yes": {node: CQ2}
      "no":  {node: CQ4}
    CQ2:
      "yes": {terminal: cherry_picking}
      "no":  {node: CQ3}
    CQ3:
      "yes": {terminal: hasty_generalization}
      "no":  {node: CQ4, reconvergence: true}
    CQ4:
      "yes": {terminal: good_argumentation}
      "no":  {node: CQ5}
    CQ5:
      "yes": {terminal: appeal_to_tradition}
      "no":  {node: CQ6}
    CQ6:
      "yes": {terminal: appeal_to_nature}
      "no":  {terminal: ad_populum}
