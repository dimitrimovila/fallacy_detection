scheme_id: slippery_slope
name: Slippery slope argument
version: "1.1"

schema: |
  Case C0 is tentatively acceptable as an initial presumption.
  There exists a series of cases, C0, C1,..., Cn-1, where each case leads to the next
  by a combination of causal, precedent, and/or analogy steps.
  There is a climate of social opinion such that once people come to accept each
  step as plausible (or as accepted practice), they will then be led to accept the
  next step.
  The penultimate step Cn-1 leads to a horrible outcome, Cn, which is not acceptable.
  Therefore, C0 is not acceptable (contrary to the presumption of the initial premise).

identification_question: >-
  Does the text put forward the argument that, if a particular action is permitted
  or carried out (even if it is minor or seemingly harmless), it will inevitably
  lead (through a chain of intermediate consequences) to an extreme or catastrophic
  final outcome?

variables:
  C0: the initial case, tentatively acceptable
  "C1, ..., Cn-1": the intermediate cases, each leading to the next
  Cn: the horrible outcome that is not acceptable

default_answer_space: ["yes", "no"]

critical_questions:
  - id: CQ1
    text: >-
      Do any of the causal links in the chain lack sufficient evidence to support
      the claim that they will (might, must) occur?
  - id: CQ2
    text: Is the outcome Cn as bad as suggested?
  - id: CQ3
    text: >-
      Is it possible to provide a precise definition that removes the ambiguity to
      such an extent as to halt the decline?
  - id: CQ4
    text: >-
      Are there other steps required to fill in the sequence of events and make it
      plausible?
  - id: CQ4.1
    text: Would these steps lead to a different conclusion?
  - id: CQ5
    text: >-
      Are there weak links in the sequence, where specific critical questions should
      be asked on whether one event will really lead to another?

graph:
  start: CQ1
  nodes:
    CQ1:
      "yes": {terminal: slippery_slope}
      "no":  {node: CQ2}
    CQ2:
      "yes": {node: CQ3}
      "no":  {terminal: slippery_slope, reconvergence: true}
    CQ3:
      "yes": {terminal: definist_fallacy}
      "no":  {node: CQ4}
    CQ4:
      "yes": {node: CQ4.1}
      "no":  {node: CQ5}
    CQ4.1:
      "yes": {terminal: slippery_slope, reconvergence: true}
      "no":  {node: CQ5, reconvergence: true}
    CQ5:
      # "yes" means that there are weak links in the sequence, hence the fallacy, as in
      # the thesis diagram and in its Comment: "Una risposta negativa, ovvero l'assenza di
      # anelli deboli, conduce alla conclusione di un'argomentazione valida [...] Se invece
      # esistono anelli deboli, l'argomentazione rimane viziata" [A negative answer, that
      # is, the absence of weak links, leads to the conclusion of a valid argument ... If
      # instead there are weak links, the argument remains flawed].
      "yes": {terminal: slippery_slope, reconvergence: true}
      "no":  {terminal: good_argumentation}
