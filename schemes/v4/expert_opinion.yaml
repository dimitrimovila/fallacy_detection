# Version 2.1, chosen on the 601 test items.
scheme_id: expert_opinion
name: Argument from expert opinion
version: "2.1"

schema: |
  S is an authoritative source (whether individual or collective) in the domain D.
  S asserts that A is known to be true.
  A is in D.
  (A implies the conclusion C)
  Therefore A (and/or C) may (plausibly) be taken as true.

identification_question: >-
  Does this text use the opinion of a (supposedly) authoritative source as
  evidence to support a claim?

variables:
  S: the source
  D: the domain
  A: the assertion made by the source
  C: the conclusion drawn by the arguer

default_answer_space: ["yes", "no"]

critical_questions:
  - id: CQ1
    text: >-
      Does S have competence, expertise or direct knowledge relevant to the domain D of the
      claim?
  - id: CQ2
    text: >-
      Does the conclusion rest only on S's word, with no evidence or reasoning for it given
      by S or by the arguer?
  - id: CQ3
    text: Did S really assert (or claim) A as true?
  - id: CQ4
    text: Is there a conclusion C that differs from A but uses A to justify itself?
  - id: CQ5
    text: >-
      Has S expressed a position of their own on the issue under discussion, in this
      exchange or elsewhere?
  - id: CQ6
    text: >-
      Assuming that A is true, does the conclusion C follow from it without an unjustified
      leap?

graph:
  start: CQ1
  nodes:
    CQ1:
      "yes": {node: CQ2}
      "no":  {terminal: irrelevant_authority}
    CQ2:
      "yes": {terminal: appeal_to_authority}
      "no":  {node: CQ3}
    CQ3:
      "yes": {node: CQ4}
      "no":  {node: CQ5}
    CQ4:
      "yes": {node: CQ6}
      "no":  {terminal: good_argumentation}
    CQ5:
      "yes": {terminal: strawman}
      "no":  {terminal: false_attribution}
    CQ6:
      "yes": {terminal: good_argumentation}
      "no":  {terminal: non_sequitur}
