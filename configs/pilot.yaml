# The pilot: 50 items, two models in two reasoning conditions, five samples.
# `argfallacy run plan configs/pilot.yaml` counts the calls without making any.

name: pilot

items:
  n: 50
  seed: 20260911
  # stratified by gold scheme, proportionally, with at least 4 items per scheme
  min_per_scheme: 4
  # `none` has no CQs to ask: left out of the pilot
  exclude_none_scheme: true

stages: [stage1, stage2]
scheme_condition: gold
# four entries: Qwen3.8 and Gemma 4, each with reasoning off and on.
# The `_think` entries have their own `max_tokens` in serving/models.yaml, which applies
# instead of the one below: the reasoning comes before the JSON and 512 would cut it off.
models: [qwen3_8_27b, qwen3_8_27b_think, gemma4_31b, gemma4_31b_think]
samples: 5
prompt_version: v1

generation:
  temperature_sample0: 0.0
  temperature_rest: 0.7
  max_tokens: 512
