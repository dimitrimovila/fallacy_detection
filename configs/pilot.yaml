# Il pilota: 50 item, due modelli in due condizioni di ragionamento, cinque campioni.
# `argfallacy run plan configs/pilot.yaml` conta le chiamate senza farne nessuna.

name: pilot

items:
  n: 50
  seed: 20260911
  # stratificato per schema gold, in proporzione, con almeno 4 item per schema
  min_per_scheme: 4
  # `none` non ha CQ da porre: fuori dal pilota
  exclude_none_scheme: true

stages: [stage1, stage2]
scheme_condition: gold
# quattro voci: Qwen3.8 e Gemma 4, ciascuno con ragionamento spento e acceso.
# Le voci `_think` hanno un `max_tokens` proprio in serving/models.yaml, che vale al
# posto di quello qui sotto: il ragionamento arriva prima del JSON e 512 lo troncherebbe.
models: [qwen3_8_27b, qwen3_8_27b_think, gemma4_31b, gemma4_31b_think]
samples: 5
prompt_version: v1

generation:
  temperature_sample0: 0.0
  temperature_rest: 0.7
  max_tokens: 512
