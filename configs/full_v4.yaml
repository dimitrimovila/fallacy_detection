# Full run on the schemes of version 2.1 (schemes/v3/), with the stage two prompt v4 written
# on their CQs: stage two only, under the gold scheme, for the items of the test set, with
# the entries and regimes of full_v3.yaml. Only the CQs listed under `cqs` are asked: every
# other CQ of version 2.1 has the same prompt as a CQ of version 2.0, apart from its id, and
# takes its answers from full run v3 (`argfallacy run assemble`).
# `argfallacy run plan configs/full_v4.yaml` counts the calls.

name: full_v4

items:
  exclude_none_scheme: false

stages: [stage2]
scheme_condition: gold
schemes: v3
models: [qwen3_8_27b, gemma4_31b, gpt_oss_20b, gpt_oss_120b, k2_horizon_32b_high]
prompt_version: v4

generation:
  max_tokens: 512

cqs:
  analogy: [CQ2, CQ4]
  cause_to_effect: [CQ3, CQ4]
  example: [CQ2, CQ3, CQ4, CQ5]
  expert_opinion: [CQ2, CQ6]
  popular_opinion: [CQ1, CQ2, CQ3, CQ4, CQ5, CQ6]
  slippery_slope: [CQ3]
