# Second round of the filter question of argument from example (schemes/v4g/): two wordings
# asked in the place of CQ2 of schemes/v4/, on the 86 example items of the test set, with the
# entries and regimes of full_v4.yaml. The prompt v7 has the template of v5.
# `argfallacy run plan configs/example_filter2.yaml` counts the calls.

name: example_filter2

items:
  exclude_none_scheme: false

stages: [stage2]
scheme_condition: gold
schemes: v4g
models: [qwen3_8_27b, gemma4_31b, gpt_oss_20b, gpt_oss_120b, k2_horizon_32b_high]
prompt_version: v7

generation:
  max_tokens: 512

cqs:
  example: [CQ2l, CQ2m]
