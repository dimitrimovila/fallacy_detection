# The evaluation of round 2: C1, C2 and C3 on full run v2, their exploratory configurations
# on full run v3, C4 and its control on the S-soft runs, the uncertainty of C5, and the four
# deciding comparisons at level 1 - 0.05/m. `argfallacy evaluate configs/evaluation_round2.yaml`
# writes it into evaluations/round2/, replacing the previous output.
# The runs must have been parsed by the current parser; the zero-shot run of the reference
# model needs its p_label, a feature of C2.

name: round2
runs:
  answers: 20261005T193017Z_full_v2
  answers_schemes_2: 20261019T151336Z_full_v3
  zeroshot:
    - 20261009T221950Z_zeroshot_v1
    - 20261021T111606Z_zeroshot_k2
  judge:
    - 20261021T111110Z_judge_v1
    - 20261021T111110Z_judge_v1_answers_only
  ssoft: [20261025T133031Z_ssoft_full_v3]          # the run of configs/ssoft_full_v3.yaml
  ssoft_nohistory: [20261025T133031Z_ssoft_nohistory_full_v3]  # the run of configs/ssoft_nohistory_full_v3.yaml
# a guard: the command computes the reference model and stops if it is another
reference_model: qwen3_8_27b
# one seed for the folds and the resamples, the same as round 1
seed: 20261019
resamples: 10000
folds: 5
# the number of components with a primary configuration, for the Bonferroni level
m: 4
# the exploratory C1 without the CQ labels of these schemes, whose sheets went through a
# different checking procedure; it is scored on the other schemes
cq_label_exclusion: [example, cause_to_effect, correlation_to_cause]
