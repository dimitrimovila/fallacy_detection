# Ablation of the reasoning effort of K2 Horizon: the 50 items of pilot2, the same
# selection, at `high` with one sample. Compared with `k2_horizon_32b` at `low` in the run
# of pilot2. `argfallacy run plan configs/ablation_k2_effort.yaml` counts the calls.

name: ablation_k2_effort

items:
  n: 50
  seed: 20260911
  # stratified by gold scheme, proportionally, with at least 4 items per scheme
  min_per_scheme: 4
  # `none` has no CQs to ask: left out of the pilot
  exclude_none_scheme: true

stages: [stage1, stage2]
scheme_condition: gold
models: [k2_horizon_32b_high]
prompt_version: v2

generation:
  # for the entries without a max_tokens of their own
  max_tokens: 512
