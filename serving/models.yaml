# I modelli e come si servono. Versione 3.
#
# Sei modelli in tre fasce (`tier`), in otto voci: Qwen3.8 e Gemma 4 ne hanno due
# ciascuno, con il ragionamento spento e acceso.
#   tier 1: il pilota e l'esecuzione principale. Tre famiglie diverse, per la combinazione.
#   tier 2: dopo il pilota. gpt oss 120b fa coppia con il 20b della fascia 1 per l'effetto
#           taglia; K2 Horizon 32B porta una quarta famiglia.
#   tier 3: commerciale, senza logprob, spento di default. Mai modello principale.
#
# `model_id`  il nome con cui vLLM serve il modello: e' il repository passato a `vllm serve`.
# `revision`  il commit Hugging Face del repository, lo stesso passato a `vllm serve
#             --revision`. >>> DA COMPLETARE <<< Finche' contiene PLACEHOLDER,
#             `ask()` si rifiuta di partire: senza commit fissato il modello puo' cambiare
#             sotto i piedi fra il pilota e l'esecuzione completa, e i numeri non si
#             riproducono. Per il modello commerciale e' lo snapshot datato dell'API.
# `reasoning` come si governa il ragionamento. `chat_template_kwargs` finisce in
#             `extra_body` della chiamata; `reasoning_effort` e' un parametro della chiamata.
#             Qwen3.8 e Gemma 4 lo spengono e lo accendono sugli stessi pesi, quindi hanno
#             due voci con lo stesso `model_id` e la stessa `revision`: la voce base con
#             `enable_thinking: false`, la voce `_think` con `enable_thinking: true` e il
#             livello di default del template. Le due voci si servono con due avvii
#             distinti del server, che differiscono per il parser di ragionamento: le note
#             di ogni voce dicono con quali flag. Per gpt oss non si spegne del tutto e si
#             tiene al minimo, quindi le sue risposte non nascono nelle stesse condizioni
#             degli altri modelli. Per K2 Horizon non si spegne, e il livello va ancora scelto.
# `max_tokens` facoltativo: vale al posto di quello della configurazione. Serve alle voci
#             `_think`, che scrivono il ragionamento prima del JSON e con i 512 della
#             configurazione verrebbero troncate.
# `enabled`   un modello spento non entra in nessun piano.
# `supports_logprobs`  il server restituisce i logprob dei token.
# `is_reasoning`       il modello puo' ragionare prima di rispondere.
# `max_concurrency`    quante chiamate simultanee al massimo.
#
# revision, tier, reasoning e max_tokens entrano nel manifest di ogni esecuzione e nella
# chiave della cache: cambiarne uno produce chiamate nuove, non risposte vecchie riusate.

version: "3.0"

models:

  # ------------------------------------------------------------------- tier 1
  qwen3_8_27b:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "PLACEHOLDER"
    display_name: "Qwen3.8 27B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    notes: >-
      Pilota, condizione principale. Ragionamento spento dal template di chat. Il server
      si avvia senza `--reasoning-parser`: con il parser acceso e nessun ragionamento vLLM
      smette di applicare il vincolo dello schema JSON senza errori ne' avvisi, e le
      risposte fuori formato diventerebbero `invalid` senza una causa visibile.

  qwen3_8_27b_think:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "PLACEHOLDER"
    display_name: "Qwen3.8 27B (ragionamento acceso)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    max_concurrency: 8
    max_tokens: 8192
    notes: >-
      Stessi pesi e stessa revisione di `qwen3_8_27b`: cambia solo il ragionamento, acceso
      al livello di default del template. Server a parte, avviato con
      `--reasoning-parser qwen3` e `--max-model-len 16384`.

  gemma4_31b:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "PLACEHOLDER"
    display_name: "Gemma 4 31B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    notes: >-
      Pilota, condizione principale. Ragionamento spento dal template di chat. Il server
      si avvia senza `--reasoning-parser`: con il parser acceso e nessun ragionamento vLLM
      smette di applicare il vincolo dello schema JSON senza errori ne' avvisi, e le
      risposte fuori formato diventerebbero `invalid` senza una causa visibile.

  gemma4_31b_think:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "PLACEHOLDER"
    display_name: "Gemma 4 31B (ragionamento acceso)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    max_concurrency: 8
    max_tokens: 8192
    notes: >-
      Stessi pesi e stessa revisione di `gemma4_31b`: cambia solo il ragionamento, acceso
      al livello di default del template. Server a parte, avviato con
      `--reasoning-parser gemma4` e `--max-model-len 16384`.

  gpt_oss_20b:
    tier: 1
    model_id: "openai/gpt-oss-20b"
    revision: "PLACEHOLDER"
    display_name: "gpt oss 20b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 8
    notes: "Il ragionamento non si spegne: effort al minimo. I logprob vanno letti sul token della risposta dentro il JSON, non sul primo token generato."

  # ------------------------------------------------------------------- tier 2
  gpt_oss_120b:
    tier: 2
    model_id: "openai/gpt-oss-120b"
    revision: "PLACEHOLDER"
    display_name: "gpt oss 120b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 4
    notes: "Coppia con gpt_oss_20b: stessa famiglia, cambia solo la taglia. Stessa avvertenza sul ragionamento."

  k2_horizon_32b:
    tier: 2
    model_id: "IFM/K2-Horizon-32B"
    revision: "PLACEHOLDER"
    display_name: "K2 Horizon 32B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    notes: >-
      Denso, 32B. Il ragionamento non si spegne: si regola con `reasoning_effort` in
      `chat_template_kwargs`, e il model card documenta solo `high`. Finche' `reasoning`
      resta vuoto il modello ragiona al livello di default del template. Il repository
      contiene un checkpoint di stadio 1, con la versione finale annunciata: la revisione
      va fissata sul checkpoint che si usa davvero. vLLM chiede in piu' `--trust-remote-code`,
      `--reasoning-parser k2_horizon`, `--tool-call-parser k2_horizon`.

  # ------------------------------------------------------------------- tier 3
  gpt_5_5:
    tier: 3
    model_id: "gpt-5.5"
    revision: "PLACEHOLDER"
    display_name: "GPT-5.5"
    enabled: false
    supports_logprobs: false
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    notes: "Commerciale, via API e non via vLLM. Niente logprob: p_logprob resterebbe vuota. Spento di default; se si accende, la politica sul ragionamento va decisa prima."
