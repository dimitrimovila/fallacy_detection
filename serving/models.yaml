# The models and how they are served. Version 3.7.
#
# Six models in three tiers (`tier`), in eight entries: Qwen3.8 and Gemma 4 have two
# each, with reasoning off and on. The open models are served with vLLM 0.30.0, installed
# as `serving/README.md` says.
#   tier 1: the pilot and the main run. Three different families, for the combination.
#   tier 2: after the pilot. gpt oss 120b pairs with the 20b of tier 1 for the size
#           effect; K2 Horizon 32B brings a fourth family.
#   tier 3: commercial, no logprobs, disabled by default. Never a main model.
#
# `model_id`  the name vLLM serves the model under: the repository passed to `vllm serve`.
# `revision`  the Hugging Face commit of the repository, the same one passed to `vllm serve
#             --revision`. While it holds PLACEHOLDER, `ask()` refuses to start: without a
#             pinned commit the model can change underneath us between the pilot and the
#             full run, and the numbers do not reproduce. For the commercial model it is
#             the dated snapshot of the API.
# `reasoning` how the reasoning is controlled. `chat_template_kwargs` ends up in the
#             `extra_body` of the call; `reasoning_effort` is a parameter of the call.
#             Qwen3.8 and Gemma 4 switch it off and on over the same weights, so they have
#             two entries with the same `model_id` and the same `revision`: the base entry
#             with `enable_thinking: false`, the `_think` entry with `enable_thinking: true`
#             and the template's default level. The two entries are served by two separate
#             launches of the server, which differ in the reasoning parser: `serve_args` of
#             each entry gives the flags. For gpt oss it does not switch off: the effort
#             takes only low, medium or high, and it is kept at low, so its answers are
#             not produced under the same conditions as those of the other models. For
#             K2 Horizon it does not switch off, and the level is still to be chosen.
# `max_tokens` optional: applies instead of the one in the configuration. The `_think`
#             entries, K2 Horizon and gpt oss need it: they write their reasoning before
#             the JSON, and with the 512 of the configuration they would be cut off.
# `serve_args` the flags of `vllm serve` that depend on the entry. `serving/serve_command.py`
#             prints `model_id --revision revision` followed by them, and `--max-model-len
#             8192` when they do not set it; the job adds port, host, tensor parallelism and
#             dtype. The commercial model has none: it is not served with vLLM.
# `enabled`   a disabled model enters no plan.
# `supports_logprobs`  the server returns the token logprobs.
# `is_reasoning`       the model can reason before answering.
# `max_concurrency`    the maximum number of simultaneous calls.
#
# revision, tier, reasoning and max_tokens go into the manifest of every run and into the
# cache key: changing one of them produces new calls, not old answers reused. serve_args goes
# into the manifest only: the entry already determines it.

version: "3.7"

models:

  # ------------------------------------------------------------------- tier 1
  qwen3_8_27b:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    display_name: "Qwen3.8 27B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    serve_args: []
    notes: >-
      Pilot, main condition. Reasoning switched off by the chat template. The server
      starts without `--reasoning-parser`: with the parser on and no reasoning, vLLM
      stops enforcing the JSON schema constraint with no error or warning, and the
      answers out of format would become `invalid` with no visible cause.

  qwen3_8_27b_think:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    display_name: "Qwen3.8 27B (reasoning on)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    max_concurrency: 8
    max_tokens: 8192
    serve_args: [--reasoning-parser, qwen3, --max-model-len, "16384"]
    notes: >-
      Same weights and same revision as `qwen3_8_27b`: only the reasoning changes, switched
      on at the template's default level. Separate server: without the reasoning parser,
      structured output would constrain the JSON from the first token and the model would
      not reason; the context holds the prompt and the 8192 tokens of `max_tokens`.

  gemma4_31b:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
    display_name: "Gemma 4 31B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    serve_args: []
    notes: >-
      Pilot, main condition. Reasoning switched off by the chat template. The server
      starts without `--reasoning-parser`: with the parser on and no reasoning, vLLM
      stops enforcing the JSON schema constraint with no error or warning, and the
      answers out of format would become `invalid` with no visible cause.

  gemma4_31b_think:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
    display_name: "Gemma 4 31B (reasoning on)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    max_concurrency: 8
    max_tokens: 8192
    serve_args: [--reasoning-parser, gemma4, --max-model-len, "16384"]
    notes: >-
      Same weights and same revision as `gemma4_31b`: only the reasoning changes, switched
      on at the template's default level. Separate server: without the reasoning parser,
      structured output would constrain the JSON from the first token and the model would
      not reason; the context holds the prompt and the 8192 tokens of `max_tokens`.

  gpt_oss_20b:
    tier: 1
    model_id: "openai/gpt-oss-20b"
    revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
    display_name: "gpt oss 20b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 8
    max_tokens: 8192
    serve_args: [--max-model-len, "16384", --reasoning-parser, openai_gptoss]
    notes: >-
      The reasoning does not switch off: there is no supported way to turn it off, the
      effort takes only low, medium or high, and it is kept at low. The reasoning comes
      before the JSON, so the entry has the room of the `_think` entries: with the 512
      tokens of the configuration the answer could be cut off, and with a context of
      8192 a prompt of about 650 tokens plus the 8192 of `max_tokens` would be refused;
      the context of 16384 holds both. `--reasoning-parser openai_gptoss`: vLLM moves
      the JSON schema to the `final` channel of the harmony format, leaving the
      `analysis` channel free for the reasoning, only when a parser is configured
      (`_adjust_output_format` in `vllm/parser/harmony.py`, called from the branch
      `parser is not None` of `vllm/renderers/online_renderer.py`); without it the
      schema constrains the JSON from the first token and the model does not reason.
      The logprobs must be read on the answer token inside the JSON, not on the first
      generated token.

  # ------------------------------------------------------------------- tier 2
  gpt_oss_120b:
    tier: 2
    model_id: "openai/gpt-oss-120b"
    revision: "b5c939de8f754692c1647ca79fbf85e8c1e70f8a"
    display_name: "gpt oss 120b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 4
    max_tokens: 8192
    serve_args: [--max-model-len, "16384", --reasoning-parser, openai_gptoss]
    notes: >-
      Pairs with gpt_oss_20b: same family, only the size changes. Same reasoning, kept
      at low, the same room for it (`max_tokens` 8192 and a context of 16384) and the
      same reasoning parser, for the reasons given in the notes of gpt_oss_20b.

  k2_horizon_32b:
    tier: 2
    model_id: "IFM/K2-Horizon-32B"
    revision: "eff3d24a3a40360c6fd1a1dd5723ce6329d93484"
    display_name: "K2 Horizon 32B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    max_tokens: 8192
    serve_args: [--trust-remote-code, --reasoning-parser, k2_horizon, --tool-call-parser,
                 k2_horizon, --max-model-len, "16384", --chat-template-content-format, string]
    notes: >-
      Dense, 32B. The reasoning does not switch off: it is set with `reasoning_effort` in
      `chat_template_kwargs`, and the model card documents only `high`. While `reasoning`
      stays empty the model reasons at the template's default level. Since it always
      reasons before the JSON, it has the room of the `_think` entries: the context holds
      the prompt and the 8192 tokens of `max_tokens`. The revision is the
      head of `main` on 28 September 2026, commit eff3d24a3a40 of 24 September ("delete the
      sentence final checkpoint to be released"), which removed from the model card the
      announcement of a final checkpoint; the history of the repository keeps the
      intermediate checkpoints `sft_1_*`. The repository carries code of its
      own, which vLLM runs only with `--trust-remote-code`, and vLLM has a reasoning parser
      and a tool call parser for this model. `--chat-template-content-format string`:
      vLLM detects the content format of this chat template as `openai` and passes the
      content of a message as a list of parts, while the template, at this revision,
      reads the content only when it is a string. The prompt then reaches the model
      empty: 10 prompt tokens against 549 for Qwen3.8 on the same prompt, and an answer
      about a greeting. vLLM does not fill `usage.reasoning_tokens` for this model: it is
      0 even when the model reasons, so the length of the reasoning comes from the text
      of the reasoning field of the message, not from `usage`.

  # ------------------------------------------------------------------- tier 3
  gpt_5_5:
    tier: 3
    model_id: "gpt-5.5"
    revision: "PLACEHOLDER"
    display_name: "GPT-5.5"
    enabled: false
    supports_logprobs: false
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    notes: "Commercial, through the API and not through vLLM. No logprobs: p_logprob would stay empty. Disabled by default; if it is enabled, the reasoning policy must be decided first."
