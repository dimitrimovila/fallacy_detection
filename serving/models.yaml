# The models and how they are served. Version 3.1.
#
# Six models in three tiers (`tier`), in eight entries: Qwen3.8 and Gemma 4 have two
# each, with reasoning off and on. The open models are served with vLLM 0.30.0, installed
# as `serving/README.md` says.
#   tier 1: the pilot and the main run. Three different families, for the combination.
#   tier 2: after the pilot. gpt oss 120b pairs with the 20b of tier 1 for the size
#           effect; K2 Horizon 32B brings a fourth family.
#   tier 3: commercial, no logprobs, disabled by default. Never a main model.
#
# `model_id`  the name vLLM serves the model under: the repository passed to `vllm serve`.
# `revision`  the Hugging Face commit of the repository, the same one passed to `vllm serve
#             --revision`. While it holds PLACEHOLDER, `ask()` refuses to start: without a
#             pinned commit the model can change underneath us between the pilot and the
#             full run, and the numbers do not reproduce. K2 Horizon keeps PLACEHOLDER
#             until its checkpoint is chosen. For the commercial model it is the dated
#             snapshot of the API.
# `reasoning` how the reasoning is controlled. `chat_template_kwargs` ends up in the
#             `extra_body` of the call; `reasoning_effort` is a parameter of the call.
#             Qwen3.8 and Gemma 4 switch it off and on over the same weights, so they have
#             two entries with the same `model_id` and the same `revision`: the base entry
#             with `enable_thinking: false`, the `_think` entry with `enable_thinking: true`
#             and the template's default level. The two entries are served by two separate
#             launches of the server, which differ in the reasoning parser: the notes of
#             each entry say with which flags. For gpt oss it does not switch off entirely
#             and is kept at the minimum, so its answers are not produced under the same
#             conditions as those of the other models. For K2 Horizon it does not switch
#             off, and the level is still to be chosen.
# `max_tokens` optional: applies instead of the one in the configuration. The `_think`
#             entries need it: they write their reasoning before the JSON, and with the 512
#             of the configuration they would be cut off.
# `enabled`   a disabled model enters no plan.
# `supports_logprobs`  the server returns the token logprobs.
# `is_reasoning`       the model can reason before answering.
# `max_concurrency`    the maximum number of simultaneous calls.
#
# revision, tier, reasoning and max_tokens go into the manifest of every run and into the
# cache key: changing one of them produces new calls, not old answers reused.

version: "3.1"

models:

  # ------------------------------------------------------------------- tier 1
  qwen3_8_27b:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    display_name: "Qwen3.8 27B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    notes: >-
      Pilot, main condition. Reasoning switched off by the chat template. The server
      starts without `--reasoning-parser`: with the parser on and no reasoning, vLLM
      stops enforcing the JSON schema constraint with no error or warning, and the
      answers out of format would become `invalid` with no visible cause.

  qwen3_8_27b_think:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    display_name: "Qwen3.8 27B (reasoning on)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    max_concurrency: 8
    max_tokens: 8192
    notes: >-
      Same weights and same revision as `qwen3_8_27b`: only the reasoning changes, switched
      on at the template's default level. Separate server, launched with
      `--reasoning-parser qwen3` and `--max-model-len 16384`.

  gemma4_31b:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
    display_name: "Gemma 4 31B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    notes: >-
      Pilot, main condition. Reasoning switched off by the chat template. The server
      starts without `--reasoning-parser`: with the parser on and no reasoning, vLLM
      stops enforcing the JSON schema constraint with no error or warning, and the
      answers out of format would become `invalid` with no visible cause.

  gemma4_31b_think:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
    display_name: "Gemma 4 31B (reasoning on)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    max_concurrency: 8
    max_tokens: 8192
    notes: >-
      Same weights and same revision as `gemma4_31b`: only the reasoning changes, switched
      on at the template's default level. Separate server, launched with
      `--reasoning-parser gemma4` and `--max-model-len 16384`.

  gpt_oss_20b:
    tier: 1
    model_id: "openai/gpt-oss-20b"
    revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
    display_name: "gpt oss 20b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 8
    notes: "The reasoning does not switch off: effort at the minimum. The logprobs must be read on the answer token inside the JSON, not on the first generated token."

  # ------------------------------------------------------------------- tier 2
  gpt_oss_120b:
    tier: 2
    model_id: "openai/gpt-oss-120b"
    revision: "b5c939de8f754692c1647ca79fbf85e8c1e70f8a"
    display_name: "gpt oss 120b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 4
    notes: "Pairs with gpt_oss_20b: same family, only the size changes. Same caveat on the reasoning."

  k2_horizon_32b:
    tier: 2
    model_id: "IFM/K2-Horizon-32B"
    revision: "PLACEHOLDER"
    display_name: "K2 Horizon 32B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    notes: >-
      Dense, 32B. The reasoning does not switch off: it is set with `reasoning_effort` in
      `chat_template_kwargs`, and the model card documents only `high`. While `reasoning`
      stays empty the model reasons at the template's default level. The repository
      holds a stage 1 checkpoint, with the final version announced: the revision
      must be pinned to the checkpoint actually used. vLLM also needs `--trust-remote-code`,
      `--reasoning-parser k2_horizon`, `--tool-call-parser k2_horizon`.

  # ------------------------------------------------------------------- tier 3
  gpt_5_5:
    tier: 3
    model_id: "gpt-5.5"
    revision: "PLACEHOLDER"
    display_name: "GPT-5.5"
    enabled: false
    supports_logprobs: false
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    notes: "Commercial, through the API and not through vLLM. No logprobs: p_logprob would stay empty. Disabled by default; if it is enabled, the reasoning policy must be decided first."
