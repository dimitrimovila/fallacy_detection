# The models and how they are served. Version 3.8.
#
# Six models in three tiers (`tier`), in eight entries: Qwen3.8 and Gemma 4 have two
# each, with reasoning off and on. The open models are served with vLLM 0.30.0, installed
# as `serving/README.md` says.
#   tier 1: the pilot and the main run. Three different families, for the combination.
#   tier 2: after the pilot. gpt oss 120b pairs with the 20b of tier 1 for the size
#           effect; K2 Horizon 32B brings a fourth family.
#   tier 3: commercial, no logprobs, disabled by default. Never a main model.
#
# `model_id`  the name vLLM serves the model under: the repository passed to `vllm serve`.
# `revision`  the Hugging Face commit of the repository, the same one passed to `vllm serve
#             --revision`. While it holds PLACEHOLDER, `ask()` refuses to start: without a
#             pinned commit the model can change underneath us between the pilot and the
#             full run, and the numbers do not reproduce. For the commercial model it is
#             the dated snapshot of the API.
# `reasoning` how the reasoning is controlled. `chat_template_kwargs` ends up in the
#             `extra_body` of the call; `reasoning_effort` is a parameter of the call.
#             Qwen3.8 and Gemma 4 switch it off and on over the same weights, so they have
#             two entries with the same `model_id` and the same `revision`: the base entry
#             with `enable_thinking: false`, the `_think` entry with `enable_thinking: true`
#             and the template's default level. The two entries are served by two separate
#             launches of the server, which differ in the reasoning parser: `serve_args` of
#             each entry gives the flags. For gpt oss it does not switch off: the effort
#             takes only low, medium or high, and it is kept at low, so its answers are
#             not produced under the same conditions as those of the other models. For
#             K2 Horizon it does not switch off and its depth is chosen per request:
#             phase 2 runs `k2_horizon_32b_high`, at high with one sample, while
#             `k2_horizon_32b`, at low with five samples, is the entry of the second pilot.
# `max_tokens` optional: applies instead of the one in the configuration. The `_think`
#             entries, K2 Horizon and gpt oss need it: they write their reasoning before
#             the JSON, and with the 512 of the configuration they would be cut off. The
#             entries with reasoning off have 1024, room for a justification that runs on.
# `samples`, `temperature`, `top_p`, `top_k`  how many answers the entry gives to every
#             question, and how each is drawn: the same parameters for every sample, with
#             the seed equal to the sample index, at both stages. The client always sends
#             the three sampling parameters. `top_k: 0` is the value that switches top-k off
#             in vLLM 0.30.0 (`SamplingParams`). An entry without the four fields cannot be
#             planned. One sample at temperature 0 for the entries that answer without
#             reasoning: the hard answer is that sample, the soft one its logprobs. Five at
#             the temperature recommended by the producer for the entries that always
#             reason: the hard answer is the majority, the soft one the frequency.
# `serve_args` the flags of `vllm serve` that depend on the entry. `serving/serve_command.py`
#             prints `model_id --revision revision` followed by them, and `--max-model-len
#             8192` when they do not set it; the job adds port, host, tensor parallelism and
#             dtype. The commercial model has none: it is not served with vLLM. Every entry
#             of the runs has `--generation-config vllm`, so that the `generation_config.json`
#             of the model does not put its sampling values in place of those of the
#             request, and `--structured-outputs-config` with the xgrammar backend and
#             `disable_any_whitespace`, so that the JSON has one layout, `{"answer": "`, and
#             the context before the answer token is the same in every call. With gpt oss
#             vLLM turns the schema into a structural tag of the harmony format, which xgrammar
#             compiles with free whitespace whatever the option says (vLLM issue 54497).
# `enabled`   a disabled model enters no plan.
# `supports_logprobs`  the server returns the token logprobs.
# `is_reasoning`       the model can reason before answering.
# `reasoning_optional` the entry reasons but may answer without reasoning: in the smoke test
#                      no reasoning is a warning, not a stop. A cut-off answer still stops.
# `max_concurrency`    the maximum number of simultaneous calls.
#
# revision, tier, reasoning, max_tokens, the sampling parameters and serve_args go into the
# manifest of every run and into the cache key: changing one of them produces new calls, not
# old answers reused.

version: "3.8"

models:

  # ------------------------------------------------------------------- tier 1
  qwen3_8_27b:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    display_name: "Qwen3.8 27B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    max_tokens: 1024
    samples: 1
    temperature: 0.0
    top_p: 1.0
    top_k: 0
    serve_args: [--generation-config, vllm, --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      Pilot, main condition. Reasoning switched off by the chat template. The server
      starts without `--reasoning-parser`: with the parser on and no reasoning, vLLM
      stops enforcing the JSON schema constraint with no error or warning, and the
      answers out of format would become `invalid` with no visible cause. One sample at
      temperature 0: the hard answer is that sample, and its logprobs the soft one.
      `max_tokens` 1024: in the first pilot the 99th percentile of the answers was 115
      tokens, and the only two cut off at 512 were justifications that had turned into
      reasoning.

  qwen3_8_27b_think:
    tier: 1
    model_id: "Qwen/Qwen3.8-27B"
    revision: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
    display_name: "Qwen3.8 27B (reasoning on)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    reasoning_optional: false
    max_concurrency: 8
    max_tokens: 32768
    samples: 1
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    serve_args: [--reasoning-parser, qwen3, --max-model-len, "34816", --generation-config, vllm,
                 --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      Same weights and same revision as `qwen3_8_27b`: only the reasoning changes, switched
      on at the template's default level. Separate server: without the reasoning parser,
      structured output would constrain the JSON from the first token and the model would
      not reason. One sample at temperature 1, top_p 0.95 and top_k 20, the values of the
      `generation_config.json` of the model, sent with every request since the server
      ignores that file (`--generation-config vllm`). `max_tokens` 32768 and a context of
      34816, the longest prompt of the v2 templates (1269 tokens with this tokenizer and
      the reasoning on, stage one) plus 32768, rounded up to a multiple of 1024. Trace of
      the ablation of the reasoning (`configs/ablation_reasoning.yaml`), not part of phase
      2: reasoning on did not agree with the per-CQ annotation significantly more than
      reasoning off, which phase 2 keeps. The first pilot,
      run with `max_tokens` 8192 and a context of 16384, is reproducible from the tag
      `pilot1`.

  gemma4_31b:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
    display_name: "Gemma 4 31B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 8
    max_tokens: 1024
    samples: 1
    temperature: 0.0
    top_p: 1.0
    top_k: 0
    serve_args: [--generation-config, vllm, --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      Pilot, main condition. Reasoning switched off by the chat template. The server
      starts without `--reasoning-parser`: with the parser on and no reasoning, vLLM
      stops enforcing the JSON schema constraint with no error or warning, and the
      answers out of format would become `invalid` with no visible cause. One sample at
      temperature 0: the hard answer is that sample, and its logprobs the soft one.
      `max_tokens` 1024: in the first pilot the 99th percentile of the answers was 115
      tokens, and the only two cut off at 512 were justifications that had turned into
      reasoning.

  gemma4_31b_think:
    tier: 1
    model_id: "google/gemma-4-31B-it"
    revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
    display_name: "Gemma 4 31B (reasoning on)"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {enable_thinking: true}}
    reasoning_optional: false
    max_concurrency: 8
    max_tokens: 32768
    samples: 1
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    serve_args: [--reasoning-parser, gemma4, --max-model-len, "34816", --generation-config, vllm,
                 --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      Same weights and same revision as `gemma4_31b`: only the reasoning changes, switched
      on at the template's default level. Separate server: without the reasoning parser,
      structured output would constrain the JSON from the first token and the model would
      not reason. One sample at temperature 1, top_p 0.95 and top_k 64, the values of the
      `generation_config.json` of the model, sent with every request since the server
      ignores that file (`--generation-config vllm`). `max_tokens` 32768 and a context of
      34816, the longest prompt of the v2 templates (1231 tokens with this tokenizer and
      the reasoning on, stage one) plus 32768, rounded up to a multiple of 1024. Trace of
      the ablation of the reasoning (`configs/ablation_reasoning.yaml`), not part of phase
      2: reasoning on did not agree with the per-CQ annotation significantly more than
      reasoning off, which phase 2 keeps. The first pilot,
      run with `max_tokens` 8192 and a context of 16384, is reproducible from the tag
      `pilot1`.

  gpt_oss_20b:
    tier: 1
    model_id: "openai/gpt-oss-20b"
    revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
    display_name: "gpt oss 20b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 8
    max_tokens: 32768
    samples: 5
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    serve_args: [--max-model-len, "34816", --reasoning-parser, openai_gptoss,
                 --generation-config, vllm, --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      The reasoning does not switch off: there is no supported way to turn it off, the
      effort takes only low, medium or high, and it is kept at low. Five samples at
      temperature 1 and top_p 1, the sampling OpenAI recommends for gpt oss. The
      reasoning comes before the JSON, so the answer needs room: `max_tokens` 32768, and
      a context of 34816, the longest prompt of the v2 templates (1238 tokens with this
      tokenizer, stage one, over every item and every scheme and CQ) plus 32768,
      rounded up to a multiple of 1024. `--reasoning-parser openai_gptoss`: vLLM moves
      the JSON schema to the `final` channel of the harmony format, leaving the
      `analysis` channel free for the reasoning, only when a parser is configured
      (`_adjust_output_format` in `vllm/parser/harmony.py`, called from the branch
      `parser is not None` of `vllm/renderers/online_renderer.py`); without it the
      schema constrains the JSON from the first token and the model does not reason.
      The logprobs must be read on the answer token inside the JSON, not on the first
      generated token. The schema reaches xgrammar as a structural tag of the harmony
      format, compiled with free whitespace: `disable_any_whitespace` does not reach it
      (vLLM issue 54497). With five samples the soft answer is their frequency, so the
      layout check of the smoke test only warns.

  # ------------------------------------------------------------------- tier 2
  gpt_oss_120b:
    tier: 2
    model_id: "openai/gpt-oss-120b"
    revision: "b5c939de8f754692c1647ca79fbf85e8c1e70f8a"
    display_name: "gpt oss 120b"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 4
    max_tokens: 32768
    samples: 5
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    serve_args: [--max-model-len, "34816", --reasoning-parser, openai_gptoss,
                 --generation-config, vllm, --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      Pairs with gpt_oss_20b: same family, only the size changes. Same reasoning, kept
      at low, the same sampling, the same room for it (`max_tokens` 32768 and a context
      of 34816: the tokenizer is the same) and the same reasoning parser, for the
      reasons given in the notes of gpt_oss_20b.

  k2_horizon_32b:
    tier: 2
    model_id: "IFM/K2-Horizon-32B"
    revision: "eff3d24a3a40360c6fd1a1dd5723ce6329d93484"
    display_name: "K2 Horizon 32B"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {reasoning_effort: low}}
    reasoning_optional: true
    max_concurrency: 4
    max_tokens: 32768
    samples: 5
    temperature: 1.0
    top_p: 0.95
    top_k: 0
    serve_args: [--trust-remote-code, --reasoning-parser, k2_horizon, --tool-call-parser,
                 k2_horizon, --max-model-len, "34816", --chat-template-content-format, string,
                 --generation-config, vllm, --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      Dense, 32B. The reasoning does not switch off: its depth is chosen per request with
      `reasoning_effort` in `chat_template_kwargs`, `high` (the default of the template),
      `medium` or `low`; the template opens the reasoning with a different tag for each,
      and the reasoning parser of vLLM ends it on the matching one, structured output
      included. This entry, at `low` with five samples, is the one of the second pilot
      and does not enter phase 2: at `low` the model closes its reasoning at once, before
      any thinking, on every call of the pilot (hence `reasoning_optional`). Phase 2 runs
      `k2_horizon_32b_high`. Five samples at temperature 1 and top_p 0.95, the sampling of
      the model card. Since it always reasons before the JSON, the answer needs room:
      `max_tokens` 32768, and a context of 34816, the longest prompt of the v2 templates
      (1161 tokens with this tokenizer, stage one) plus 32768, rounded up to a multiple
      of 1024. The revision is the
      head of `main` on 28 September 2026, commit eff3d24a3a40 of 24 September ("delete the
      sentence final checkpoint to be released"), which removed from the model card the
      announcement of a final checkpoint; the history of the repository keeps the
      intermediate checkpoints `sft_1_*`. The repository carries code of its
      own, which vLLM runs only with `--trust-remote-code`, and vLLM has a reasoning parser
      and a tool call parser for this model. `--chat-template-content-format string`:
      vLLM detects the content format of this chat template as `openai` and passes the
      content of a message as a list of parts, while the template, at this revision,
      reads the content only when it is a string. The prompt then reaches the model
      empty: 10 prompt tokens against 549 for Qwen3.8 on the same prompt, and an answer
      about a greeting. vLLM does not fill `usage.reasoning_tokens` for this model: it is
      0 even when the model reasons, so the length of the reasoning comes from the text
      of the reasoning field of the message, not from `usage`.

  k2_horizon_32b_high:
    tier: 2
    model_id: "IFM/K2-Horizon-32B"
    revision: "eff3d24a3a40360c6fd1a1dd5723ce6329d93484"
    display_name: "K2 Horizon 32B, high effort"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {chat_template_kwargs: {reasoning_effort: high}}
    reasoning_optional: false
    max_concurrency: 4
    max_tokens: 32768
    samples: 1
    temperature: 1.0
    top_p: 0.95
    top_k: 0
    serve_args: [--trust-remote-code, --reasoning-parser, k2_horizon, --tool-call-parser,
                 k2_horizon, --max-model-len, "34816", --chat-template-content-format, string,
                 --generation-config, vllm, --structured-outputs-config,
                 '{"backend": "xgrammar", "disable_any_whitespace": true}']
    notes: >-
      The K2 Horizon entry of phase 2: `reasoning_effort` high, the level at which the
      model card reports its results, with one sample at temperature 1 and top_p 0.95.
      On the 50 pilot items its answers agree with the per-CQ annotation more than those
      of `k2_horizon_32b` at low (exact McNemar test below 0.05). Everything else, served
      flags included, is that entry's, so its calls share their cache keys with any
      earlier call at `high` with the same sampling.

  # ------------------------------------------------------------------- tier 3
  gpt_5_5:
    tier: 3
    model_id: "gpt-5.5"
    revision: "PLACEHOLDER"
    display_name: "GPT-5.5"
    enabled: false
    supports_logprobs: false
    is_reasoning: true
    reasoning: {}
    max_concurrency: 4
    notes: "Commercial, through the API and not through vLLM. No logprobs: p_logprob would stay empty. Disabled by default; if it is enabled, the reasoning policy must be decided first."
