# Hand-written rewrites of the two critical questions of the schemes version 2.0
# (popular_opinion CQ1, ad_hominem CQ6). Same polarity as the original question: "yes"
# stands for the positive class of the boundary (popular_good_vs_ad_populum:
# good_argumentation; ad_hominem_poisoning_vs_abusive: poisoning_the_well).

popular_good_vs_ad_populum:
  - "Does the text give a reason why the reference group is likely to be right about A, beyond the bare fact that many people accept it?"
  - "Is the wide acceptance of A offered as a presumption that remains open to other evidence, rather than as proof that A is true?"
  - "Is the reference group in a position to know whether A is true, for example through direct experience?"

ad_hominem_poisoning_vs_abusive:
  - "Is the attack presented as a reason to dismiss whatever the person says or will say, instead of as a reply to a particular claim?"
  - "Is the attack made before the other person has put forward the argument in question?"
  - "Does the text warn the audience not to trust or accept what the person says, on the basis of the attack on them?"
