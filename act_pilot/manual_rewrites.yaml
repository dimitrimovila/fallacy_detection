# Hand-written rewrites of the two critical questions. Drafts to be revised by hand.
# Same polarity as the original question: "yes" stands for the positive class of the
# boundary (B1: good_argumentation; B2: poisoning_the_well).

B1:
  - "Does the text give a reason why the reference group is likely to be right about A (for example expertise, direct experience or careful deliberation), beyond the bare fact that many people accept it?"
  - "Is the wide acceptance of A offered as a presumption that remains open to other evidence, rather than as proof that A is true?"
  - "Is A the kind of matter on which wide acceptance is a reasonable guide, such as a shared practice, a social norm or common experience?"

B2:
  - "Is the attack meant to make the audience distrust in advance anything the person will say on the topic, rather than to reply to an argument the person has already made?"
  - "Is the attack presented as a reason to dismiss whatever the person says or will say, instead of as a reply to a particular claim?"
  - "Is the attack made before the person has put forward the argument in question, so that the argument will be discounted when it is made?"
