# Vocabulary of the fallacy labels. Version 1.7.
# 1.7 compared with 1.6: every terminal has a `definition`, and the four ad hominem variants a
# `display_label`, both for the zero-shot prompt; the terminals take one field per line. No
# id, label, alias or space changed.
# 1.6 compared with 1.5: the compat block, with the strings that the scoring code of the
# prior runs writes in its own code. No terminal, alias or space changed.
# 1.5 compared with 1.4: the space collapsed_eleni is called collapsed_compat, like the
# scorer mode that uses it. No content changed.
# 1.4 compared with 1.3: added the coarse any_fallacy, for the rows where the annotator
# says there is a fallacy without saying which.
# 1.3 compared with 1.2: the family name on its own is not a
# coarse label but a kind of its own (family, see the families section), and the
# uninterpretable outputs of the models are not idk but invalid_outputs.
# 1.2 compared with 1.1: four new aliases, found by the audit of Eleni's results.csv files.
# No terminal, no space and no arc changed in either of the two.
# Replaces schemes/_vocabulary.yaml (version 1.0), of which it keeps
# the keys terminals, coarse_labels, out_of_scope, aliases, idk_markers and the decisions
# (false_cause as a coarse label with partial credit; scheme_mismatch never
# resolved silently). Adds: family and schemes per terminal, appeal_to_emotion among
# the out_of_scope, the aliases seen in Eleni's results.csv files and in the workbook, the
# label spaces and the missing-value markers.
# Rule: a new alias is added here, never in the code.
# Aliases are compared after light normalization: lower case, whitespace squeezed.

version: "1.7"

# Families. A family id is a class in the collapsed spaces and is not one in the
# fine space. normalize_label recognises it with kind "family": it accepts no
# terminal, so in the fine space it can never come out correct, while in a
# collapsed space it collapses onto itself and can be compared with the other classes.
# It is not a coarse label: it is not refined and gives no partial credit.
families:
  ad_hominem:
    label: "Ad Hominem"
    note: "Used by the collapsed spaces. Includes Ad Fidentia and Poisoning the Well, as in Eleni's collapse."

# The verdicts the diagrams reach. `label` names a terminal everywhere; `display_label`, where
# present, is the name the zero-shot prompt shows in its place (the four ad hominem variants
# lose their prefix: the prompt already names the scheme), and the parser takes it back to
# the id. `definition` is what that prompt says the verdict means: an English translation of
# the definition the thesis gives under "Fallacie relative allo schema" in chapter 3 (one text
# per fallacy, the same in every scheme where it occurs), with nothing added; where the
# original has two sentences, they are joined into one. The thesis does not define Good
# Argumentation: its definition is the project's own.
terminals:
  good_argumentation:
    label: "Good Argumentation"
    type: good
    schemes: [analogy, cause_to_effect, correlation_to_cause, example, expert_opinion, popular_opinion, slippery_slope]
    definition: "The argument is acceptable as it stands: none of the fallacies listed applies to it."
    note: "The definition is the project's own: the thesis defines only the fallacies."
  ad_fidentia:
    label: "Ad Fidentia"
    type: fallacy
    family: ad_hominem
    schemes: [ad_hominem]
    definition: "Attacking the person's self-esteem instead of the argument or the evidence supporting it."
  ad_hominem_abusive:
    label: "Ad Hominem (Abusive)"
    display_label: "Abusive"
    type: fallacy
    family: ad_hominem
    schemes: [ad_hominem]
    definition: >-
      Attacking the person making the argument, rather than the argument itself, when the
      attack on the person is entirely irrelevant to the argument they are making.
  ad_hominem_circumstantial:
    label: "Ad Hominem (Circumstantial)"
    display_label: "Circumstantial"
    type: fallacy
    family: ad_hominem
    schemes: [ad_hominem]
    definition: >-
      Suggesting that the person making the argument is biased or predisposed to take a
      certain position and that, as a consequence, the argument is necessarily invalid.
  ad_hominem_guilt_by_association:
    label: "Ad Hominem (Guilt by Association)"
    display_label: "Guilt by Association"
    type: fallacy
    family: ad_hominem
    schemes: [ad_hominem]
    definition: >-
      When the source is viewed negatively because of its link with another person or group
      that is already viewed negatively.
  ad_hominem_tu_quoque:
    label: "Ad Hominem (Tu Quoque)"
    display_label: "Tu Quoque"
    type: fallacy
    family: ad_hominem
    schemes: [ad_hominem]
    definition: >-
      Claiming that the argument is flawed by pointing out that the person who makes it does
      not act consistently with what the argument itself states.
  ad_populum:
    label: "Ad Populum"
    type: fallacy
    schemes: [popular_opinion]
    definition: "Using the popularity of a premise or a thesis as evidence of its truth."
  appeal_to_authority:
    label: "Appeal to Authority"
    type: fallacy
    schemes: [ad_hominem, expert_opinion]
    definition: >-
      Claiming that a statement is true simply because a technical, moral or religious
      authority has declared it so, without any other supporting evidence being given.
  appeal_to_extremes:
    label: "Appeal to Extremes"
    type: fallacy
    schemes: [analogy, example]
    definition: >-
      Wrongly trying to turn a reasonable argument into an absurd one by taking it to
      extremes; it is not a valid reductio ad absurdum.
  appeal_to_nature:
    label: "Appeal to Nature"
    type: fallacy
    schemes: [popular_opinion]
    definition: 'Holding that something is better or truer only because it is "natural".'
  appeal_to_tradition:
    label: "Appeal to Tradition"
    type: fallacy
    schemes: [popular_opinion]
    definition: >-
      Using people's historical preferences (tradition), in a general or in a specific
      sense, as evidence that such a historical preference is correct.
  causal_reductionism:
    label: "Causal Reductionism"
    type: fallacy
    schemes: [cause_to_effect, correlation_to_cause]
    definition: >-
      Assuming that there is a single cause or reason for an event, when in fact the causes
      or reasons are many.
  cherry_picking:
    label: "Cherry Picking"
    type: fallacy
    schemes: [analogy, cause_to_effect, example, popular_opinion]
    definition: >-
      When only qualitatively selected evidence is presented to persuade the audience to
      accept a given position, leaving out the evidence that contradicts it; the stronger
      the evidence left out, the more fallacious the argument.
  definist_fallacy:
    label: "Definist Fallacy"
    type: fallacy
    schemes: [correlation_to_cause, slippery_slope]
    definition: "Defining a term in such a way as to make one's own position much easier to defend."
  false_attribution:
    label: "False Attribution"
    type: fallacy
    schemes: [example, expert_opinion]
    definition: >-
      Appealing to an irrelevant, unqualified, unidentified, biased or made-up source in
      support of an argument.
  false_premise:
    label: "False Premise"
    type: fallacy
    schemes: [analogy, cause_to_effect, correlation_to_cause]
    definition: >-
      An error of reasoning that occurs when an argument starts from a mistaken, false or
      unproven assumption.
  hasty_generalization:
    label: "Hasty Generalization"
    type: fallacy
    schemes: [cause_to_effect, correlation_to_cause, example, popular_opinion]
    definition: >-
      Drawing conclusions from a small sample, rather than examining statistics much more in
      line with the typical or average situation.
  irrelevant_authority:
    label: "Irrelevant Authority"
    type: fallacy
    schemes: [expert_opinion]
    definition: >-
      Appealing to a supposed authority as evidence in support of one's own argument, when
      that authority is not in fact competent on the facts relevant to the argument itself.
  non_sequitur:
    label: "Non Sequitur"
    type: fallacy
    schemes: [expert_opinion]
    definition: >-
      When the conclusion does not follow from the premises; in more informal reasoning,
      this can happen when what is presented as evidence or reason is irrelevant or
      contributes only minimally to supporting the conclusion.
  poisoning_the_well:
    label: "Poisoning the Well"
    type: fallacy
    family: ad_hominem
    schemes: [ad_hominem]
    definition: >-
      Launching a pre-emptive ad hominem attack against an opponent, that is, preparing the
      audience from the start with negative information about the opponent, in an attempt to
      make one's own thesis more acceptable or to lessen the credibility of the opponent's.
  post_hoc:
    label: "Post Hoc"
    type: fallacy
    schemes: [cause_to_effect, correlation_to_cause]
    definition: >-
      Claiming that, since event Y followed event X, event Y must have been caused by event
      X, without having adequately shown the causal link.
  questionable_cause:
    label: "Questionable Cause"
    type: fallacy
    schemes: [correlation_to_cause]
    definition: "Concluding that one thing caused the other simply because they are often associated."
  slippery_slope:
    label: "Slippery Slope"
    type: fallacy
    schemes: [slippery_slope]
    definition: >-
      When a relatively insignificant first event is assumed to lead to a more significant
      event, which in turn leads to an even more significant event, and so on, until a final,
      significant event is reached, where the link between each event is not only unfounded
      but becomes less and less likely at each step.
  strawman:
    label: "Strawman"
    type: fallacy
    schemes: [expert_opinion]
    definition: >-
      Replacing a person's actual position or argument with a distorted, exaggerated or
      misrepresented version of that position or argument.
  weak_analogy:
    label: "Weak Analogy"
    type: fallacy
    schemes: [analogy, example]
    definition: >-
      When an analogy is used to prove or refute an argument, but the analogy is too
      dissimilar to be effective, that is, it has more differences than similarities with
      the case under consideration.

# Coarse labels found in the data: they name a family, not a terminal.
# They are not refined; in evaluation they give partial credit
# (any terminal in refines_to that the scheme produces) and the share of coarse gold must
# be reported separately. Compat mode does not apply this rule.
coarse_labels:
  false_cause:
    label: "False Cause"
    refines_to: [post_hoc, questionable_cause, causal_reductionism]

  # Eleni records "there is a fallacy" without saying which (column fallacy Eleni, value YES).
  # Same rule as false_cause: not refined, gives partial credit, and the share must be
  # reported separately. resolve_for_scheme intersects it with the terminals of the scheme, so
  # in practice it is satisfied by every fallacious terminal of the scheme the row sits under.
  any_fallacy:
    label: "Any Fallacy"
    refines_to: [
      ad_fidentia, ad_hominem_abusive, ad_hominem_circumstantial,
      ad_hominem_guilt_by_association, ad_hominem_tu_quoque, ad_populum,
      appeal_to_authority, appeal_to_extremes, appeal_to_nature, appeal_to_tradition,
      causal_reductionism, cherry_picking, definist_fallacy, false_attribution,
      false_premise, hasty_generalization, irrelevant_authority, non_sequitur,
      poisoning_the_well, post_hoc, questionable_cause, slippery_slope, strawman,
      weak_analogy]

# Found in the data, produced by no diagram. Outside the label spaces.
out_of_scope:
  appeal_to_emotion: {label: "Appeal to Emotion", note: "Former terminal of ad hominem CQ1 positive, replaced by Appeal to Authority. It can appear in predictions made with the previous version."}

# Label spaces: terminal id -> id in the space. Whatever is not listed stays itself.
spaces:
  fine: {}
  collapsed_symmetric:
    ad_fidentia: ad_hominem
    ad_hominem_abusive: ad_hominem
    ad_hominem_circumstantial: ad_hominem
    ad_hominem_guilt_by_association: ad_hominem
    ad_hominem_tu_quoque: ad_hominem
    poisoning_the_well: ad_hominem
  collapsed_compat:
    ad_fidentia: ad_hominem
    ad_hominem_abusive: ad_hominem
    ad_hominem_circumstantial: ad_hominem
    ad_hominem_guilt_by_association: ad_hominem
    poisoning_the_well: ad_hominem

# Compat mode only: the string rules of the scoring code of the prior runs, besides the
# ad hominem family and its members, which it takes from the sections above. The canonical
# mode never reads this block, and compat mode never reads the aliases.
compat:
  # Removed from the start of a label, in this order, each at most once; the words may be
  # separated by any whitespace.
  removed_prefixes: ["argument from", "argument"]
  # A label that starts with the key followed by a space becomes the value, whole.
  replaced_by_prefix: {"good": "good argument"}
  # Rewritten last, after the ad hominem rules, by exact match.
  rewrites: {"casual reductionism": "causal reductionism"}

# Raw label (lower case, whitespace squeezed) -> id. Applies to terminals, coarse and out_of_scope.
# Besides this table the loader applies one deterministic rule only: spaces to underscores
# and parentheses removed, so "Ad Hominem (Tu Quoque)" finds ad_hominem_tu_quoque.
aliases:
  "abusive": ad_hominem_abusive
  "abusive ad hominem": ad_hominem_abusive
  "ad fidentia ad hominem": ad_fidentia
  "ad fidentiam": ad_fidentia
  "appeal to populum": ad_populum
  "appelal to extremes": appeal_to_extremes
  "casual reductionism": causal_reductionism
  "circumstantial": ad_hominem_circumstantial
  "circumstantial ad hominem": ad_hominem_circumstantial
  "false authority": irrelevant_authority
  "false causality": false_cause
  "false cause": false_cause
  "good argomentation": good_argumentation
  "good argument": good_argumentation
  "guilt by association": ad_hominem_guilt_by_association
  "guilty by association": ad_hominem_guilt_by_association
  "hasty generalisation": hasty_generalization
  "no": good_argumentation
  "no fallacy": good_argumentation
  "none": good_argumentation
  "not fallacious": good_argumentation
  "post hoc ergo propter hoc": post_hoc
  "questionable cause": questionable_cause
  "straw man": strawman
  "tu quoque": ad_hominem_tu_quoque
  "tu quoque ad hominem": ad_hominem_tu_quoque
  # Column `fallacy Eleni` of the analogy and expert opinion sheets: NO says there is no
  # fallacy, YES says there is one but not which.
  "yes": any_fallacy

# Markers of the annotator's uncertainty about the final label. They are not verdicts.
idk_markers: ["?", "??", "idk", "unknown", "non so", "dubbio", "indeterminato"]

# Uninterpretable outputs of the models, by exact string (no approximate
# matching). normalize_label sends them to kind "invalid". An invalid output is a
# wrong prediction in every label space, not an abstention: it is not refined,
# it collapses onto no class, it is never excluded from the denominator, and the audit
# counts it separately as an invalid output of the model that produced it.
invalid_outputs:
  "Ad Hominem Red Herring": "two labels in one"
  "Appeal to Emotion/Ad Populum": "two labels in one"
  "Appeal to Emotion/False Premise": "two labels in one"
  "Red Herring/Straw Man": "two labels in one"
  "None, but close to Appeal to Authority or Ad Populum, however the argument is more accurately described as an inductive generalization based on multiple testimonies": "prose instead of a label"
  "Uncertain: Unexpected answer for 'cq2' (expected: yes/no): '[MISSING ANSWER]'": "pipeline error message instead of a label"
  "Uncertain: Unexpected answer for 'cq3' (expected: yes/no): '[MISSING ANSWER]'": "pipeline error message instead of a label"

# Values that mean an empty cell. The audit counts them separately.
missing_markers: ["", "nan", "NaN", "n/a", "N/A"]

# In the `Annotazione Dumitru` sheets it says the scheme is absent: scheme `none` and no verdict.
# It is not good argumentation, it is the absence of the case.
scheme_absent_markers: ["n.a. (schema assente)"]
