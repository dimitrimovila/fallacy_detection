# Dictionary of the scheme labels. Version 1.1.
# Eight schemes from Enrico Bergamasco's thesis plus none (no scheme present).
# The aliases come from Eleni's results.csv (predicted_scheme, gold_scheme), the workbook sheets
# and the titles of the diagrams. Compared after light normalization (lower case, whitespace).

version: "1.1"

schemes:

  example:
    name: "Argument from Example"
    aliases: ["Argument from Example", "Example", "Arg. from Example"]

  analogy:
    name: "Argument from Analogy"
    aliases: ["Argument from Analogy", "Analogy"]

  cause_to_effect:
    name: "Argument from Cause to Effect"
    aliases: ["Argument from Cause to Effect", "Cause to Effect", "cause_to_effect"]

  correlation_to_cause:
    name: "Argument from Correlation to Cause"
    aliases: ["Argument from Correlation to Cause", "Correlation to Cause", "correlation_to_cause",
              "Correlation to effect"]
    note: "Correlation to effect is a slip in the workbook (9 rows of cause_to_effect): no scheme has that name."

  ad_hominem:
    name: "Ad Hominem"
    aliases: ["Ad Hominem", "Argument ad hominem", "ad_hominem"]
    note: "The only scheme without a Good Argumentation terminal."

  expert_opinion:
    name: "Argument from Expert Opinion"
    aliases: ["Argument from Expert Opinion", "Expert Opinion", "expert_opinion"]

  popular_opinion:
    name: "Argument from Popular Opinion"
    aliases: ["Argument from Popular Opinion", "Popular Opinion", "popular_opinion"]
    note: "The workbook sheet is called new_ad_populum, but the scheme is popular opinion. Ad populum is a fallacy, not a scheme: do not add it here."

  slippery_slope:
    name: "Slippery Slope"
    aliases: ["Slippery Slope", "Slippery Slope Argument", "slippery_slope"]

  none:
    name: "No scheme"
    aliases: ["none", "no", "no scheme", "nessuno", "nessuno schema"]
    note: "Scheme judged absent by an annotator of the workbook. No item of the test set has this gold."

special_values:
  # SNI appears in the scheme columns of the workbook next to YES and NO, and means idk,
  # not `none`.
  idk: ["?", "??", "idk", "IDK", "dubbio", "SNI"]
  missing: ["", "nan", "NaN", "n/a", "N/A"]
