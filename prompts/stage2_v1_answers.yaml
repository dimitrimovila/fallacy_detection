# What each admitted answer means, in the stage-two prompt. Version v1.
#
# It is part of the prompt as much as stage2_v1.md, and shares its version: after the first
# run on a real model, every change here creates a new version.
# The keys yes and no must be quoted: in YAML 1.1 they are booleans.
#
# No reference to the fallacy labels: a definition says what the question asks,
# never where the answer leads in the diagram. The notes of the scheme YAML files
# stay out of the prompt for the same reason.

prompt_version: stage2_v1

# Meaning of yes and no for every CQ that has no entry under `per_cq`.
default:
  "yes": the text supports answering yes to the question
  "no": the text supports answering no to the question

# The third option, a choice of this project: Enrico's thesis asks for yes or no and
# names an answer that cannot be determined only as future work. {options} becomes the real
# alternatives of the question, in the order in which the prompt lists them.
cannot_be_determined: >-
  use this answer only if the text contains no information at all on the point
  being asked about. If the text contains partial information, answer {options}
  and lower your confidence.

# The fourth option, added by the code exactly like cannot_be_determined: never
# in the answer_space of a scheme. It tells the absence of the question's object apart
# from uncertainty about how that object stands, which remains cannot_be_determined.
na: >-
  use this answer only if the question has no object in this text: the thing
  it asks about does not exist in the argument. If it exists but you cannot
  tell how it stands, answer cannot_be_determined instead and lower your
  confidence.

# The CQs whose answers are not yes and no. The options are listed in the order written
# here, which is the order in which the question names them. The set must match the
# answer_space of the diagram, otherwise rendering fails.
per_cq:
  ad_hominem:
    CQ1:
      negative: >-
        the opinion expressed about the other person is negative and intended to
        undermine their credibility
      positive: >-
        the opinion expressed about the other person is positive and intended to
        enhance their credibility
