# What each admitted answer means, in the stage two prompt. Version v4, for the diagrams of
# version 2.1 in schemes/v3/ and schemes/v3b/; the template stage2_v4.md is the same text as
# stage2_v3.md, and every text below outside `per_cq` is that of stage2_v3_answers.yaml.
#
# It is part of the prompt as much as stage2_v3.md, and shares its version: after the
# first run on a real model, every change here creates a new version.
# The keys yes and no must be quoted: in YAML 1.1 they are booleans.
#
# No reference to the fallacy labels: a definition says what the question asks,
# never where the answer leads in the diagram. The notes of the scheme YAML files
# stay out of the prompt for the same reason. No examples either: an example would
# steer the model towards its own surface features.

prompt_version: stage2_v4

# Meaning of yes and no for every CQ that has no entry under `per_cq`. The
# instructions of the template apply to every CQ.
default:
  "yes": for the argument in this text, the answer to the question is yes
  "no": for the argument in this text, the answer to the question is no

# Meaning of any other admitted answer of a CQ without an entry under `per_cq`, such as
# the letters of a question that spells out its alternatives in its own text. {option}
# becomes the answer; no other braces here.
default_other: for the argument in this text, the answer to the question is {option}

# The third option, a choice of this project. {options} becomes the real alternatives
# of the question, in the order in which the prompt lists them. No other braces here:
# the text goes through str.format.
cannot_be_determined: >-
  use this only if you have no basis at all for answering {options}, even after
  using everything listed in the section "What to do". The text not
  stating the answer explicitly is not, by itself, a reason to use it.
  If you lean towards one answer, however slightly, give it and lower your confidence.

# The fourth option, added by the code exactly like cannot_be_determined: never in
# the answer_space of a scheme. It marks something the question takes for granted
# that the argument does not contain, not a missing mention of what the question asks about.
na: >-
  use this answer only if the question takes for granted something that this argument
  does not contain, not even implicitly, so that none of the other answers makes sense.
  If the question itself asks whether something exists, answer it normally.
  If what the question takes for granted is present, answer the question, even if you are unsure how it stands.

# The entries below are the definitions written with the 2.1 diagrams, word for word;
# every other CQ uses `default` (or `default_other`). The options are listed in the order
# written here, and the set must match the answer_space of the diagram, otherwise
# rendering fails.
per_cq:
  analogy:
    CQ2:
      "yes": >-
        One or more relevant differences between C1 and C2 make the analogy too weak to
        support the conclusion about C2 as stated. Identify the difference and explain why
        it weakens the inference enough to make the analogy insufficient.
      "no": >-
        The available information gives no reason to think that a difference between C1 and
        C2 undermines the conclusion to that extent. Any identifiable differences are either
        irrelevant to the inference or weaken it only slightly.
    CQ4:
      "yes": >-
        C1 is clearly out of proportion with C2 in seriousness or scale, and the conclusion
        about C2 depends on that disproportion.
      "no": >-
        C1 and C2 are of comparable seriousness or scale, or the difference in seriousness
        does not drive the conclusion.

  cause_to_effect:
    CQ2:
      "yes": >-
        the text attributes B entirely to A, explaining B by A alone, while B evidently also
        depends on other causes
      "no": >-
        the text presents A as a cause that contributes to B or tends to produce it, without
        claiming that A is the whole explanation of B
    CQ3:
      "yes": >-
        an assumption that the prediction relies on, whether stated in the text or taken for
        granted, can be named, together with a concrete reason why it is false or clearly
        doubtful.
      "no": >-
        no such assumption can be named. This includes assumptions that are only unproven in
        the text.
    CQ4:
      "yes": >-
        the known evidence on that same link can be named and mostly goes against it, and
        the argument uses only the favourable part. A single exception, or arguments for the
        other side of a debate, are not evidence against the link.
      "no": what is known about that link is mixed or supports it, or cannot be named.
    CQ5:
      "yes": >-
        the text reports observed cases in support of the causal generalization, and they
        are too few to support it
      "no": >-
        the cases the text reports are enough to support the causal generalization, or the
        text reports no observed cases at all

  correlation_to_cause:
    CQ2:
      "yes": >-
        the text reports observed cases in support of the correlation, and they are too few
        to support it
      "no": >-
        the cases the text reports are enough to support the correlation, or the text
        reports no observed cases at all
    CQ6:
      "yes": >-
        the text attributes B entirely to A, explaining B by A alone, while B evidently also
        depends on other causes
      "no": >-
        the text presents A as a cause that contributes to B or tends to produce it, without
        claiming that A is the whole explanation of B

  example:
    CQ2:
      "yes": >-
        The argument draws a generalization from the cited examples, and they are too few,
        too limited in range, or too unrepresentative to support it as stated.
      "no": >-
        The argument does not draw a generalization from the cited examples, or the examples
        provide sufficient support for it as stated.
    CQ3:
      "yes": >-
        the text starts from a reasonable position and reasons from an exaggerated version
        of it that the position does not imply.
      "no": >-
        the argument reasons from the position as it is actually stated, or it does not
        start from any position.

  expert_opinion:
    CQ2:
      "yes": >-
        the only support the text gives for the conclusion is that S asserted it; S's title,
        role or reputation does not count as support, and neither does S's claim repeated in
        other words or in more general terms
      "no": >-
        the text gives at least one reason for the conclusion besides S's word: evidence,
        data, a cause or a mechanism, reported from S or added by the arguer, or a step of
        the arguer's own that leads from what S says to a conclusion S did not state
    CQ6:
      "yes": >-
        C follows from A, possibly through unstated steps that ordinary background knowledge
        or intuition supplies; a conclusion left implicit by a debate question counts as the
        conclusion.
      "no": >-
        C needs a further claim that neither A, the text nor ordinary background knowledge
        or intuition provides.

  popular_opinion:
    CQ1:
      "yes": >-
        the text indicates whose views are cited as evidence, such as who was asked, counted
        or observed.
      "no": >-
        the text only states that people in general, most people or a whole population
        accept A.
    CQ2:
      "yes": >-
        the text or established background knowledge shows that the way these people were
        chosen tilts their views towards the conclusion.
      "no": >-
        the group is only small, or nothing indicates that the way it was chosen favours the
        conclusion
    CQ3:
      "yes": >-
        the conclusion, whether about how widely a view is held or about A itself, goes
        beyond what the views of that many people can support.
      "no": >-
        the number of people is adequate for the conclusion, or the conclusion does not
        depend on how many people were consulted.

  slippery_slope:
    CQ3:
      "yes": >-
        there is a realistic point in the chain where it could and plausibly would be
        stopped or reversed, and the text gives no good reason why it would not be
      "no": >-
        the text makes it plausible that, once started, the chain would not realistically be
        stopped or reversed before Cn; the mere possibility of stopping it in principle is
        not enough for yes
