# Fake models for the tests. None of them reaches the network: the backend is tests/fakes/llm.py.
# They live here and not in serving/models.yaml, so that the real file holds only real models and
# the tests do not break when the revisions are filled in.

version: "test"

models:

  fake:
    tier: 1
    model_id: "fake-model"
    revision: "fake-revision-0001"
    display_name: "Fake backend"
    enabled: true
    supports_logprobs: true
    is_reasoning: false
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 4
    notes: "The model of every client test."

  fake_long:
    tier: 1
    model_id: "fake-model"
    revision: "fake-revision-0001"
    display_name: "Fake backend with its own max_tokens"
    enabled: true
    supports_logprobs: true
    is_reasoning: false
    reasoning: {chat_template_kwargs: {enable_thinking: false}}
    max_concurrency: 4
    max_tokens: 8192
    notes: "Identical to `fake` except for `max_tokens`: like the `_think` entries of the real models."

  fake_unpinned:
    tier: 1
    model_id: "fake-model"
    revision: "PLACEHOLDER"
    display_name: "Fake backend without a revision"
    enabled: true
    supports_logprobs: true
    is_reasoning: false
    reasoning: {}
    max_concurrency: 4
    notes: "Revision still a placeholder: ask() must refuse."

  fake_effort:
    tier: 2
    model_id: "fake-model"
    revision: "fake-revision-0001"
    display_name: "Fake backend with reasoning effort"
    enabled: true
    supports_logprobs: true
    is_reasoning: true
    reasoning: {reasoning_effort: low}
    max_concurrency: 4
    notes: "Like gpt oss: the reasoning does not switch off, it is turned down."

  fake_disabled:
    tier: 3
    model_id: "fake-model"
    revision: "fake-revision-0001"
    display_name: "Fake backend, disabled"
    enabled: false
    supports_logprobs: false
    is_reasoning: false
    reasoning: {}
    max_concurrency: 1
    notes: "Disabled: no plan may accept it."
