[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argfallacy"
version = "0.1.0"
description = "Explainable fallacy detection through Walton's schemes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dumitru Movila" }]

dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "openai>=1.30",
    "openpyxl>=3.1",          # the annotation workbook is .xlsx
    "jsonschema>=4.0",       # validation of the models' structured output
    "scikit-learn>=1.5",     # the logistic regression of A3
    "numpy>=1.23",           # the folds, the resamples and the metrics of the evaluation
    "scipy>=1.11",           # centred stacking and the gold-verdict optimisation
    "matplotlib>=3.8",       # the reliability diagrams of the CQ evaluation
    "threadpoolctl>=3.5",    # bounded CPU threads for the nested diagnostic fits
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
argfallacy = "argfallacy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argfallacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
